<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="titre desc">
  <title id="titre">Lol'OS pour Bbox 4K</title>
  <desc id="desc">Une TV affichant un écran d'accueil minimal façon Apple TV avec un paysage de montagnes au crépuscule, à côté du titre Lol'OS pour Bbox 4K.</desc>
  <defs>
    <clipPath id="ecran"><rect x="690" y="70" width="520" height="292" rx="14"/></clipPath>
  </defs>

  <rect width="1280" height="440" fill="#09090b"/>

  <!-- Texte -->
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#eef3f6">
    <text x="72" y="150" font-size="72" font-weight="700" letter-spacing="-2">Lol'OS</text>
    <text x="74" y="208" font-size="34" font-weight="600" letter-spacing="-0.5" fill="#f6d18b">pour Bbox 4K</text>
    <text x="74" y="276" font-size="22" fill="#9fb0bc">La refonte de votre décodeur Bouygues : plus rapide,</text>
    <text x="74" y="306" font-size="22" fill="#9fb0bc">sans pubs, avec un accueil façon Apple TV.</text>
    <g font-size="15" font-weight="600">
      <rect x="72" y="336" width="122" height="34" rx="17" fill="#ffffff" fill-opacity="0.08"/>
      <text x="133" y="358" text-anchor="middle">Windows</text>
      <rect x="204" y="336" width="88" height="34" rx="17" fill="#ffffff" fill-opacity="0.08"/>
      <text x="248" y="358" text-anchor="middle">macOS</text>
      <rect x="302" y="336" width="84" height="34" rx="17" fill="#ffffff" fill-opacity="0.08"/>
      <text x="344" y="358" text-anchor="middle">Linux</text>
      <rect x="396" y="336" width="146" height="34" rx="17" fill="#d97757" fill-opacity="0.18"/>
      <text x="469" y="358" text-anchor="middle" fill="#f3b49a">Claude Code</text>
    </g>
  </g>

  <!-- TV -->
  <g>
    <rect x="676" y="56" width="548" height="320" rx="22" fill="#18181b"/>
  </g>
  <g clip-path="url(#ecran)">
    <rect x="690" y="70" width="520" height="292" fill="#1e3a4a"/>
    <circle cx="1060" cy="160" r="34" fill="#f6d18b"/>
    <path d="M690 290 L800 190 L860 240 L940 160 L1030 250 L1110 200 L1210 270 L1210 362 L690 362 Z" fill="#2f5f6b"/>
    <path d="M690 320 L820 250 L910 300 L1010 230 L1120 300 L1210 260 L1210 362 L690 362 Z" fill="#1b4650"/>
    <path d="M940 160 L918 186 L932 184 L940 194 L952 182 L962 188 Z" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="690" y="270" width="520" height="92" fill="#0f2530" fill-opacity="0.55"/>
    <text x="1188" y="102" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="300" fill="#fff">20:45</text>
    <!-- Dock -->
    <g>
      <rect x="712" y="286" width="86" height="50" rx="8" fill="#2457e0"/>
      <text x="749" y="317" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#fff">TV</text>
      <rect x="808" y="288" width="80" height="46" rx="8" fill="#1a1531"/>
      <path d="M836 300 l18 11 l-18 11 z" fill="#8e7bff"/>
      <rect x="898" y="288" width="80" height="46" rx="8" fill="#fd4b1e"/>
      <text x="938" y="317" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#fff">arte</text>
      <rect x="988" y="288" width="80" height="46" rx="8" fill="#f5f5f5"/>
      <rect x="1014" y="302" width="26" height="18" rx="5" fill="#ff0033"/>
      <path d="M1024 306 l9 5 l-9 5 z" fill="#fff"/>
      <rect x="1078" y="288" width="110" height="46" rx="8" fill="#6d39c9"/>
      <text x="1133" y="316" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fff">Programme TV</text>
    </g>
  </g>
  <rect x="890" y="376" width="120" height="10" rx="5" fill="#18181b"/>
  <rect x="860" y="384" width="180" height="8" rx="4" fill="#27272a"/>
