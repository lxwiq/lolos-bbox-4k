[package]
name = "lolos"
version = "1.2.0"
description = "Désencombre une Bbox 4K et installe un écran d'accueil minimal"
edition = "2021"
license = "MIT"

[lib]
name = "lolos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.5.0"
zip = { version = "9", default-features = false, features = ["deflate"] }
base64 = "0.23.1"
chrono = "0.4.45"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
