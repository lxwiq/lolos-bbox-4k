# Compile l'APK du lanceur et l'installateur pour Windows, macOS et Linux,
# puis les attache à la version GitHub publiée.
name: Exécutables

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Lanceur Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > android/accueil.keystore; fi
      - name: Compilation
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: bash android/compiler.sh
      - uses: actions/upload-artifact@v6
        with:
          name: apk
          path: |
            android/Accueil.apk
            android/Accueil.version

  installateur:
    name: Installateur ${{ matrix.nom }}
    needs: apk
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          - nom: Windows
            os: windows-latest
            args: ""
          - nom: Linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: apk
          path: android
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Dépendances Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: CLI Tauri
        working-directory: app
        run: npm install
      # macOS : certificat auto-signé « LolOS », stable d'une version à l'autre (sinon macOS voit une « nouvelle »
      # appli à chaque mise à jour et retire l'autorisation « Réseau local »). Tauri n'accepte via APPLE_CERTIFICATE
      # que des certificats de confiance : on l'importe ici et Tauri le désigne par son nom (APPLE_SIGNING_IDENTITY).
      - name: Certificat de signature macOS
        if: matrix.os == 'macos-latest'
        env:
          CERTIFICAT: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICAT_MDP: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          [ -n "$CERTIFICAT" ] || { echo "Pas de certificat : signature ad hoc"; exit 0; }
          TROUSSEAU="$RUNNER_TEMP/lolos.keychain-db"
          MDP=$(openssl rand -hex 16)
          echo "$CERTIFICAT" | base64 --decode > "$RUNNER_TEMP/lolos.p12"
          security create-keychain -p "$MDP" "$TROUSSEAU"
          security set-keychain-settings -lut 3600 "$TROUSSEAU"
          security unlock-keychain -p "$MDP" "$TROUSSEAU"
          security import "$RUNNER_TEMP/lolos.p12" -k "$TROUSSEAU" -P "$CERTIFICAT_MDP" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MDP" "$TROUSSEAU" > /dev/null
          security list-keychains -d user -s "$TROUSSEAU" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/lolos.p12"
          security find-identity -p codesigning "$TROUSSEAU"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature des mises à jour automatiques (latest.json + .sig)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS : identité importée à l'étape « Certificat de signature macOS »
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        with:
          projectPath: app
          tagName: ${{ github.event.release.tag_name }}
          releaseId: ${{ github.event.release.id }}
          args: ${{ matrix.args }}

  extras:
    name: APK et CLI dans la version
    needs: [apk, installateur]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: apk
          path: android
      - name: Envoi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" android/Accueil.apk cli/lolos.py --clobber
